<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>JSSupervise | Thesis, Skripsi, and Dissertation Supervision</title>
<style>
    * { box-sizing: border-box; }
    :root{
      --midnight:#050914;
      --navy:#071426;
      --navy2:#0d2142;
      --navy3:#12325f;
      --ink:#0b1220;
      --muted:#64748b;
      --soft:#f5f7fb;
      --line:#dbe5f3;
      --white:#fff;
      --gold:#c89b2c;
      --gold2:#f0d37b;
      --blue:#1d4ed8;
      --cyan:#38bdf8;
      --green:#059669;
      --red:#dc2626;
      --shadow-lg:0 30px 80px rgba(8,18,36,.16);
      --shadow-md:0 18px 45px rgba(8,18,36,.10);
      --shadow-sm:0 10px 28px rgba(8,18,36,.07);
    }
    body {
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink);

    }
    button,input,select,textarea { font:inherit; }
    .app { min-height:100vh; display:flex; }
    .sidebar {
      width:330px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), transparent 34%),
        radial-gradient(circle at 18% 0%, rgba(240,211,123,.18), transparent 30%),

    .brand { display:flex; gap:15px; align-items:center; margin-bottom:26px; }
    .logo {

        linear-gradient(145deg, rgba(255,255,255,.95), rgba(219,234,254,.95)),

      color:#050914;
      display:flex; align-items:center; justify-content:center;

<body>
<div id="app"></div>
<script>
const APP_VERSION = "JSSupervise-2026-05-28";
const stages = [
  "Topic Selection","Draft Proposal","Proposal Review","Seminar Proposal",
  "Instrument Development","Data Collection","Data Analysis","Draft Thesis",
  "Seminar Hasil","Final Revision","Final Exam","Approved / Completed"
];
const degreeTypes = ["Skripsi","Thesis","Dissertation"];
const studentStatuses = ["Active","Need Revision","Waiting Supervisor","Ready for Seminar","Ready for Exam","Completed","At Risk"];
const documentStatuses = ["Not Uploaded","Submitted","Under Review","Revision Required","Approved"];
const meetingStatuses = ["Open","Closed"];
const roles = ["Manager","Supervisor","Student","Admin"];
const examTypes = ["Seminar Proposal","Seminar Hasil","Final Exam"];

const defaultSettings = {
  institutionName: "JSSupervise Executive Academic Supervision Suite",
  systemOwner: "Dr. Joko Slamet",
  department: "",
  academicYear: "2026",
  defaultReminderDays: "7"
};

const state = {
  active: localStorage.getItem("jss_active") || "Dashboard",
  role: localStorage.getItem("jss_role") || "Manager",
  students: JSON.parse(localStorage.getItem("jss_students") || "[]"),
  documents: JSON.parse(localStorage.getItem("jss_documents") || "[]"),
  meetings: JSON.parse(localStorage.getItem("jss_meetings") || "[]"),
  exams: JSON.parse(localStorage.getItem("jss_exams") || "[]"),
  settings: Object.assign({}, defaultSettings, JSON.parse(localStorage.getItem("jss_settings") || "null") || {}),
  query: "",
  stageFilter: "All",
  statusFilter: "All",
  drawer: null,
  editItem: null,
  preview: null
};

function save(){
  localStorage.setItem("jss_active", state.active);
  localStorage.setItem("jss_role", state.role);
  localStorage.setItem("jss_students", JSON.stringify(state.students));
  localStorage.setItem("jss_documents", JSON.stringify(state.documents));
  localStorage.setItem("jss_meetings", JSON.stringify(state.meetings));
  localStorage.setItem("jss_exams", JSON.stringify(state.exams));
  localStorage.setItem("jss_settings", JSON.stringify(state.settings));
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function id(prefix, list){ return `${prefix}-${new Date().getFullYear()}-${String(list.length+1).padStart(3,"0")}`; }
function progressOf(stage){ const i=stages.indexOf(stage); return i<0?0:Math.round(((i+1)/stages.length)*100); }
function today(){ return new Date().toISOString().slice(0,10); }
function dueDays(dateStr){ if(!dateStr) return null; const t=new Date(); t.setHours(0,0,0,0); const d=new Date(dateStr+"T00:00:00"); if(isNaN(d)) return null; return Math.ceil((d-t)/86400000); }
function dueText(dateStr){ const d=dueDays(dateStr); if(d===null) return ["No target",""]; if(d<0) return [`Overdue ${Math.abs(d)} day(s)`,"red"]; if(d===0) return ["Due today","red"]; if(d<=Number(state.settings.defaultReminderDays||7)) return [`Due in ${d} day(s)`,"amber"]; return [`Due in ${d} day(s)`,"green"]; }
function badge(value){
  let cls="badge";
  if(["Completed","Approved","Closed","Passed","Approved / Completed"].includes(value)) cls+=" green";
  else if(["At Risk","Rejected","Failed","Overdue","Revision Required"].includes(value)) cls+=" red";
  else if(["Need Revision","Under Review","Open","Waiting Supervisor"].includes(value)) cls+=" amber";
  else if(["Ready for Seminar","Ready for Exam","Submitted","Active"].includes(value)) cls+=" blue";
  else if(["Seminar Proposal","Seminar Hasil","Final Exam"].includes(value)) cls+=" purple";
  return `<span class="${cls}">${esc(value)}</span>`;
}
function exportCSV(name, rows){
  if(!rows.length){ alert("No data to export."); return; }
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(","), ...rows.map(r=>headers.map(h=>{
    let v = Array.isArray(r[h]) ? r[h].join("; ") : String(r[h] ?? "");
    return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
  }).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}
function studentById(idv){ return state.students.find(s=>s.id===idv); }
function formData(e){ return Object.fromEntries(new FormData(e.target).entries()); }
function setActive(x){ state.active=x; save(); render(); }
function setRole(x){ state.role=x; save(); render(); }
function openDrawer(type,item=null){ state.drawer=type; state.editItem=item; render(); }
function closeDrawer(){ state.drawer=null; state.editItem=null; render(); }
function removeItem(kind, idv){ if(!confirm("Delete this record?")) return; state[kind]=state[kind].filter(x=>x.id!==idv); save(); render(); }
function openPreview(type,item){ state.preview={type,item}; render(); }
function closePreview(){ state.preview=null; render(); }

function filteredStudents(){
  const q=state.query.toLowerCase();
  return state.students.filter(s=>{
    const text=[s.id,s.name,s.studentNumber,s.program,s.degreeType,s.title,s.supervisor1,s.supervisor2,s.currentStage,s.status].join(" ").toLowerCase();
    return text.includes(q) && (state.stageFilter==="All" || s.currentStage===state.stageFilter) && (state.statusFilter==="All" || s.status===state.statusFilter);
  });
}
function filteredDocuments(){ const q=state.query.toLowerCase(); return state.documents.filter(d=>[d.id,d.studentId,d.stage,d.documentName,d.version,d.status,d.supervisorFeedback].join(" ").toLowerCase().includes(q)); }
function filteredMeetings(){ const q=state.query.toLowerCase(); return state.meetings.filter(m=>[m.id,m.studentId,m.date,m.agenda,m.supervisorNotes,m.studentTasks,m.status].join(" ").toLowerCase().includes(q)); }
function filteredExams(){ const q=state.query.toLowerCase(); return state.exams.filter(x=>[x.id,x.studentId,x.examType,x.date,x.room,x.status,x.decision].join(" ").toLowerCase().includes(q)); }

function stats(){
  const total=state.students.length;
  const avg=total?Math.round(state.students.reduce((s,x)=>s+Number(x.progress||0),0)/total):0;
  const waiting=state.documents.filter(d=>["Submitted","Under Review"].includes(d.status)).length;
  const risk=state.students.filter(s=>s.status==="At Risk" || dueText(s.targetDate)[1]==="red").length;
  const completed=state.students.filter(s=>s.status==="Completed" || s.currentStage==="Approved / Completed").length;
  return {total,avg,waiting,risk,completed};
}

function studentTable(rows, compact=false){
  if(!rows.length) return empty("No students yet","Add supervised students to start tracking skripsi, thesis, and dissertation progress.");
  return `<div class="${compact?'':'card'} table-wrap"><table><thead><tr><th>Student</th><th>Research Title</th><th>Supervisors</th><th>Stage</th><th>Progress</th><th>Documents</th><th>Meeting</th><th>Status</th><th>Action</th></tr></thead><tbody>
  ${rows.map(s=>{
    const docs=state.documents.filter(d=>d.studentId===s.id);
    const mtgs=state.meetings.filter(m=>m.studentId===s.id);
    const due=dueText(s.targetDate);
    return `<tr>
      <td><strong>${esc(s.name)}</strong><br><small>${esc(s.studentNumber)}</small><br><small>${esc(s.degreeType)} | ${esc(s.program)}</small></td>
      <td><strong>${esc(s.title)}</strong><br><small>Target: ${esc(s.targetDate||"-")} ${due[0]?`<span class="${due[1]==='red'?'badge red':due[1]==='amber'?'badge amber':'badge green'}">${esc(due[0])}</span>`:""}</small></td>
      <td>${esc(s.supervisor1||"-")}<br><small>${esc(s.supervisor2||"-")}</small></td>
      <td>${esc(s.currentStage)}</td>
      <td><div class="progress"><div style="width:${Number(s.progress||0)}%"></div></div><small>${Number(s.progress||0)}% completed</small></td>
      <td><strong>${docs.length}</strong><br><small>${docs.filter(d=>d.status==="Approved").length} approved</small></td>
      <td>Last: ${esc(s.lastMeeting||"-")}<br><small>Next: ${esc(s.nextMeeting||"-")}</small><br><small>Logs: ${mtgs.length}</small></td>
      <td>${badge(s.status)}</td>
      <td>
        <button class="btn small secondary" onclick='openPreview("student", ${JSON.stringify(s)})'>View</button>
        <button class="btn small secondary" onclick='openDrawer("student", ${JSON.stringify(s)})'>Edit</button>
        <button class="btn small danger" onclick='removeItem("students","${esc(s.id)}")'>Delete</button>
      </td>
    </tr>`;
  }).join("")}</tbody></table></div>`;
}

function drawerHTML(){
  if(!state.drawer) return "";
  const title = state.drawer==="student" ? (state.editItem?"Edit Student Supervision":"Add Student Supervision") : state.drawer==="document" ? (state.editItem?"Edit Document Review":"Add Document Review") : state.drawer==="meeting" ? (state.editItem?"Edit Supervision Meeting":"Add Supervision Meeting") : (state.editItem?"Edit Exam/Seminar":"Schedule Exam/Seminar");
  const form = state.drawer==="student" ? studentForm() : state.drawer==="document" ? documentForm() : state.drawer==="meeting" ? meetingForm() : examForm();
  return `<div class="drawer-bg show no-print"><div class="drawer"><div class="drawer-head"><div><h3>${title}</h3><p>Complete the form and save the record.</p></div><button class="btn secondary small" onclick="closeDrawer()">✕</button></div><div class="drawer-body">${form}</div></div></div>`;
}

  const m=state.editItem||{};
  return `<form class="form-grid" onsubmit="saveMeetingForm(event)">
    <input name="id" value="${val(m,'id',id('MTG',state.meetings))}" placeholder="Meeting ID" required>
    <select name="studentId" required><option value="">Select Student</option>${state.students.map(s=>`<option value="${esc(s.id)}" ${m.studentId===s.id?'selected':''}>${esc(s.name)} - ${esc(s.studentNumber)}</option>`).join("")}</select>
    <input name="date" type="date" value="${val(m,'date',today())}">
    <select name="mode"><option ${m.mode==='Offline'?'selected':''}>Offline</option><option ${m.mode==='Online'?'selected':''}>Online</option><option ${m.mode==='Hybrid'?'selected':''}>Hybrid</option></select>
    <input class="span2" name="agenda" value="${val(m,'agenda')}" placeholder="Supervision agenda" required>
    <textarea class="span2" name="supervisorNotes" placeholder="Supervisor notes">${val(m,'supervisorNotes')}</textarea>
    <textarea class="span2" name="studentTasks" placeholder="Student tasks after meeting">${val(m,'studentTasks')}</textarea>
    <input name="nextDeadline" type="date" value="${val(m,'nextDeadline')}">
    <select name="status">${meetingStatuses.map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join("")}</select>
    <div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Meeting</button></div>
  </form>`;
}
function examForm(){
  const x=state.editItem||{};
  return `<form class="form-grid" onsubmit="saveExamForm(event)">
    <input name="id" value="${val(x,'id',id('EXM',state.exams))}" placeholder="Exam/Seminar ID" required>
    <select name="studentId" required><option value="">Select Student</option>${state.students.map(s=>`<option value="${esc(s.id)}" ${x.studentId===s.id?'selected':''}>${esc(s.name)} - ${esc(s.studentNumber)}</option>`).join("")}</select>
    <select name="examType">${examTypes.map(t=>`<option ${x.examType===t?'selected':''}>${t}</option>`).join("")}</select>
    <input name="date" type="date" value="${val(x,'date',today())}">
    <input name="time" value="${val(x,'time')}" placeholder="Time, e.g. 09:00">
    <input name="room" value="${val(x,'room')}" placeholder="Room / Zoom link">
    <input name="examiner1" value="${val(x,'examiner1')}" placeholder="Examiner 1">
    <input name="examiner2" value="${val(x,'examiner2')}" placeholder="Examiner 2">
    <select name="status"><option ${x.status==='Scheduled'?'selected':''}>Scheduled</option><option ${x.status==='Completed'?'selected':''}>Completed</option><option ${x.status==='Postponed'?'selected':''}>Postponed</option><option ${x.status==='Cancelled'?'selected':''}>Cancelled</option></select>
    <select name="decision"><option ${x.decision===''?'selected':''}></option><option ${x.decision==='Passed'?'selected':''}>Passed</option><option ${x.decision==='Passed with Revision'?'selected':''}>Passed with Revision</option><option ${x.decision==='Failed'?'selected':''}>Failed</option></select>
    <textarea class="span2" name="notes" placeholder="Exam notes, revision requirements, decision notes">${val(x,'notes')}</textarea>
    <div class="span2" style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">Save Exam</button></div>
  </form>`;
}
function saveStudentForm(e){ e.preventDefault(); const x=formData(e); x.progress=Number(x.progress||progressOf(x.currentStage)); const i=state.students.findIndex(s=>s.id===x.id); if(i>=0) state.students[i]=x; else state.students.unshift(x); save(); closeDrawer(); }
function saveDocumentForm(e){ e.preventDefault(); const x=formData(e); const i=state.documents.findIndex(d=>d.id===x.id); if(i>=0) state.documents[i]=x; else state.documents.unshift(x); if(x.status==="Approved"){ const s=studentById(x.studentId); if(s){ s.currentStage=x.stage; s.progress=Math.max(Number(s.progress||0), progressOf(x.stage)); } } save(); closeDrawer(); }
function saveMeetingForm(e){ e.preventDefault(); const x=formData(e); const i=state.meetings.findIndex(m=>m.id===x.id); if(i>=0) state.meetings[i]=x; else state.meetings.unshift(x); const s=studentById(x.studentId); if(s){ s.lastMeeting=x.date; if(x.nextDeadline) s.nextMeeting=x.nextDeadline; } save(); closeDrawer(); }
function saveExamForm(e){ e.preventDefault(); const x=formData(e); const i=state.exams.findIndex(a=>a.id===x.id); if(i>=0) state.exams[i]=x; else state.exams.unshift(x); const s=studentById(x.studentId); if(s && x.status==="Completed"){ if(x.examType==="Seminar Proposal") s.currentStage="Seminar Proposal"; if(x.examType==="Seminar Hasil") s.currentStage="Seminar Hasil"; if(x.examType==="Final Exam") s.currentStage="Final Exam"; s.progress=Math.max(Number(s.progress||0), progressOf(s.currentStage)); } save(); closeDrawer(); }

function previewHTML(){
  if(!state.preview || !state.preview.item) return "";
  const s = state.preview.item;
  const docs=state.documents.filter(d=>d.studentId===s.id);
  const mtgs=state.meetings.filter(m=>m.studentId===s.id);
  const exams=state.exams.filter(e=>e.studentId===s.id);
  return `<div class="drawer-bg show"><div class="drawer"><div class="drawer-head no-print"><div><h3>Student Supervision Summary</h3><p>Preview and print supervision progress summary.</p></div><div><button class="btn secondary small" onclick="window.print()">Print</button> <button class="btn secondary small" onclick="closePreview()">✕</button></div></div><div class="drawer-body"><div id="printArea"><div class="doc-preview">
    <div class="print-head"><div><strong>${esc(state.settings.institutionName)}</strong><br><small>${esc(state.settings.department||"Integrated Supervision System")}</small></div><div class="print-title">SUPERVISION SUMMARY</div></div>
    <h2>${esc(s.name)}</h2><p>${esc(s.studentNumber)} | ${esc(s.degreeType)} | ${esc(s.program)}</p>
    <h3>Research Title</h3><p>${esc(s.title)}</p>
    <table><tr><th>Supervisor 1</th><td>${esc(s.supervisor1||"-")}</td><th>Supervisor 2</th><td>${esc(s.supervisor2||"-")}</td></tr><tr><th>Current Stage</th><td>${esc(s.currentStage)}</td><th>Progress</th><td>${esc(s.progress)}%</td></tr><tr><th>Status</th><td>${esc(s.status)}</td><th>Target Date</th><td>${esc(s.targetDate||"-")}</td></tr></table>
    <h3>Documents</h3>${docs.length?`<table><tr><th>Document</th><th>Stage</th><th>Status</th><th>Feedback</th></tr>${docs.map(d=>`<tr><td>${esc(d.documentName)}</td><td>${esc(d.stage)}</td><td>${esc(d.status)}</td><td>${esc(d.supervisorFeedback||"-")}</td></tr>`).join("")}</table>`:"<p>No document record.</p>"}
    <h3>Meetings</h3>${mtgs.length?`<table><tr><th>Date</th><th>Agenda</th><th>Tasks</th><th>Deadline</th></tr>${mtgs.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.agenda)}</td><td>${esc(m.studentTasks||"-")}</td><td>${esc(m.nextDeadline||"-")}</td></tr>`).join("")}</table>`:"<p>No meeting record.</p>"}
    <h3>Seminars / Exams</h3>${exams.length?`<table><tr><th>Type</th><th>Date</th><th>Room</th><th>Decision</th></tr>${exams.map(x=>`<tr><td>${esc(x.examType)}</td><td>${esc(x.date)}</td><td>${esc(x.room||"-")}</td><td>${esc(x.decision||"-")}</td></tr>`).join("")}</table>`:"<p>No exam record.</p>"}
  </div></div></div></div>`;
}

function render(){
  let content = state.active==="Dashboard" ? dashboard() :
    state.active==="Students" ? studentsPage() :
    state.active==="Documents" ? documentsPage() :
    state.active==="Meetings" ? meetingsPage() :
    state.active==="Exams" ? examsPage() :
    state.active==="Milestones" ? milestonesPage() :
    state.active==="Student View" ? studentViewPage() :
    state.active==="Reports" ? reportsPage() : settingsPage();
  document.getElementById("app").innerHTML = shell(content);
}
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js?v=flat1", { scope: "./" }).catch(() => {});
  });
}

</script>
</body>
</html>
